# Postgres-only subset of docker-compose.full.yml for feature 02
# (dev env setup - postgresql db). Scope: just the src_transaction_daily
# database on its own container - no spark/jupyter services.
#
# Credentials are read from environment (.env / .secrets), never hardcoded.
# Invoke with the repo root .env explicitly, e.g.:
#   docker compose --env-file .env -f docker/docker-compose.postgres.yml up -d
name: postgres-as01

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres-as01}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_as01_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_as01_data:
